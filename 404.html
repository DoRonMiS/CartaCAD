  <style>
    body { font-family: system-ui, sans-serif; display: grid; place-items: center;
           min-height: 100vh; margin: 0; color: #3B3246; }
    a { color: #3b82f6; }
  </style>
</head>
<body>
  <p>Taking you to <a href="/">CartaCAD</a>&hellip;</p>
</body>
</html>
